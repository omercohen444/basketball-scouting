name: CI

# The whole suite is offline by contract: no credentials, no network calls, no
# provider spend. That is what makes it safe to run on every push.
on:
  push:
    branches: ["main", "master", "no-video-mvp"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline test suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        # requirements-ci.txt is requirements.txt minus the CrewAI tree; no test
        # exercises a real agent, and tests/test_requirements.py keeps the two
        # manifests from drifting apart.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Confirm no credentials are present
        # Proves the suite below really is credential-free rather than quietly
        # depending on a developer's .env.
        run: |
          if [ -f .env ]; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          if env | grep -qE '^(GEMINI_API_KEY|SUPABASE_|REPORT_ADMIN_TOKEN)='; then
            echo "::error::a project credential is present in the CI environment"
            exit 1
          fi
          echo "OK: no project credentials in the environment"

      - name: Run tests
        env:
          # Belt and braces: even if the runner had these, the suite must not use them.
          GEMINI_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_SECRET_KEY: ""
          REPORT_ADMIN_TOKEN: ""
        run: python -m pytest

      - name: Verify the shipped evidence packs load in a clean checkout
        # data/raw and data/processed are git-ignored, so this is the real
        # deployment question: can the app run on what Git actually carries?
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from basketball_scout.agents.pack_store import PackStore
          store = PackStore("data/evidence_packs")
          artifacts = store.load_all()
          assert len(artifacts) == 14, f"expected 14 packs, found {len(artifacts)}"
          for artifact in artifacts.values():
              artifact.verify()
          print(f"OK: {len(artifacts)} production evidence packs load and hash-check")
          PY

      - name: Verify the app boots and serves /health without any credential
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from fastapi.testclient import TestClient
          from basketball_scout.web.app import create_app

          client = TestClient(create_app())
          health = client.get("/health")
          assert health.status_code == 200, health.text
          teams = client.get("/api/teams")
          assert teams.status_code == 200, teams.text
          assert teams.json()["teams_n"] == 14, teams.json()
          print("OK: /health and /api/teams respond with no credentials configured")
          PY
