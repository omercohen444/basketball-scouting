{# Opponent picker. A plain <form> so it works with JavaScript disabled; app.js
   upgrades it to submit on change and show a loading state. #}
<form class="selector" method="get" action="/teams/" id="team-form" data-base="/teams/">
  <label for="team-select">Opponent</label>
  <select id="team-select" name="team_id" aria-describedby="selector-help">
    <option value="" {% if not team_id %}selected{% endif %}>Choose an opponent…</option>
    {% for team in teams %}
      <option value="{{ team.team_id }}" {% if team_id == team.team_id %}selected{% endif %}>
        {{ team.team_name }} ({{ team.record }}){% if not team.has_report %} — no report yet{% endif %}
      </option>
    {% endfor %}
  </select>
  <button type="submit" class="btn">View report</button>
  <span class="loading" id="selector-loading" hidden aria-live="polite">Loading…</span>
  <p id="selector-help" class="muted small">
    {{ teams | length }} supported opponents · reports are pre-generated and read from storage
  </p>
</form>
