[project]
name = "basketball-analytics-scouting"
version = "0.1.0"
description = "Basketball analytics and AI scouting system (Israeli Premier League MVP)"
requires-python = ">=3.11"

# Everything the served product needs. The agent provider tree is an extra, not
# a core dependency, because serving saved reports must work without it — see
# reports/service.py's default_backend_factory.
dependencies = [
    "google-genai>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "truststore>=0.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Report generation only. Large transitive tree (litellm, chromadb, onnxruntime).
agents = ["crewai>=1.15,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Templates and CSS/JS are part of the web package, not loose assets.
"basketball_scout.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
# `src` layout without requiring an editable install — keeps setup friction low.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test performs real network/API calls (deselected by default runs)",
]
